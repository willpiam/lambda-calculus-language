<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lambda Calculus Runner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Lambda Calculus Runner</h1>
    <p class="subtle">Type a program, run it, load a <code>.lc</code> file, or download your work. <a href="https://github.com/willpiam/lambda-calculus-language?tab=readme-ov-file#the-%CE%BB-calculus-language-project" target="_blank" rel="noopener noreferrer">learn more</a></p>

    <div class="controls">
      <label class="inline-label" for="preset-select">Preset</label>
      <select id="preset-select" aria-label="Program presets">
        <option value="">Loading presets...</option>
      </select>
    </div>

    <label id="program-label">Program</label>
    <div id="program"></div>

    <div class="controls">
      <button id="run-btn" type="button">Run</button>
      <button id="download-btn" type="button">Download .lc</button>
      <label class="file-label" for="file-input">Load .lc</label>
      <input id="file-input" type="file" accept=".lc,text/plain" />
    </div>

    <label for="output">Output</label>
    <textarea id="output" aria-live="polite" readonly></textarea>

    <p class="bottom-link">
      <a href="https://projects.williamdoyle.ca" target="_blank" rel="noopener noreferrer">checkout my other work</a>
    </p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
